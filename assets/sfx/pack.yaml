# Framework-default SFX pack (all styles). Dry one-shots only — no whoosh / riser / swoosh.
# Real free recordings (see README.md + LICENSES.md). Prefer .wav.
theme: modern_tech
no_whoosh: true
typing:
  enabled: false
  file: typing-thock.wav
  volume: 0.38
  tile_sec: 1.2
  min_hold_sec: 4.0
shutter:
  file: shutter.wav
  volume: 0.48
  max_sec: 0.22
click:
  files:
    - click_01.wav
    - click_02.wav
    - click_03.wav
    - click_04.wav
  volume: 0.32
  max_sec: 0.22
paper:
  # Was paper_page.wav (450ms page-rustle) — read as heavy/mechanical when
  # it fires on every title/stat/quote/divider/illustration/code appear
  # (15x in a typical episode). soft_tick.wav is the same crisp, light
  # click used for `tick`; 0.22 max_sec keeps a 70ms safety margin over its
  # measured 150ms length so it never gets cut mid-decay (see SfxLayer.tsx
  # hard Sequence crop).
  file: soft_tick.wav
  volume: 0.30
  max_sec: 0.22
tick:
  file: soft_tick.wav
  volume: 0.28
  max_sec: 0.15
# NOTE: this section is documentation only — the real per-style mapping read
# at runtime lives in style_load.DEFAULT_SFX["mg"] + each style.md's own
# `sfx.mg` override. Keep them in sync.
mg:
  enabled: true
  # shutter.wav is a real double-transient mechanical-shutter recording
  # (mirror-slap + curtain click) — right for an actual cut-snap, but reads
  # as "the sound is doubled" on a chapter/diagram MG appear (e.g. a mockup
  # scene entrance). click_0X are genuinely single-transient (verified via
  # ffmpeg silencedetect) — use those for MG appear, reserve shutter for
  # real cut/punch/framing-snap events (hardcoded in sfx_suggest.py, not
  # routed through this mg table).
  chapter: click
  diagram: click
  emphasis: click
  chip: click
  title: paper
  stat: paper
  lower_third: paper
  divider: paper
  quote: paper
  illustration: paper
  code: paper
  tag: tick
density:
  sec_per_sfx: 30
  min_gap_sec: 1.2
  shutter_click_min_gap_sec: 0.4
  typing_merge_gap_sec: 1.5
