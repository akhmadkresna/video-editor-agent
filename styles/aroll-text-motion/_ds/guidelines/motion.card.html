<!-- @dsCard group="Motion" viewport="700x180" name="Entrance motions" subtitle="Pop, slide-up, fade — replay by hovering the card" -->
<link rel="stylesheet" href="../styles.css">
<style>.ov-m div{animation-fill-mode:both}.ov-m:hover .a{animation:ov-pop-in var(--dur-base) var(--ease-pop)}.ov-m:hover .b{animation:ov-slide-up var(--dur-base) var(--ease-out)}.ov-m:hover .c{animation:ov-fade var(--dur-slow) var(--ease-in-out)}</style>
<div class="ov-m" style="background:var(--ink-950);height:160px;display:flex;align-items:center;justify-content:space-around;font-family:var(--font-display);color:#fff;font-weight:800;font-size:26px">
<div class="a">POP</div><div class="b">SLIDE</div><div class="c">FADE</div>
</div>
