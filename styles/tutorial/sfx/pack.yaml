# Modern tech SFX pack — dry one-shots only. No whoosh / riser / swoosh.
# Suggest default: shutter/click (+ MG appear). Typing asset kept for opt-in / hand-author.
theme: modern_tech
no_whoosh: true
typing:
  enabled: false
  file: typing-thock.mp3
  volume: 0.38
  tile_sec: 1.2
  min_hold_sec: 4.0
shutter:
  # Deterministic dry two-stage shutter one-shot, stored with this pack.
  file: shutter.wav
  volume: 0.38
  max_sec: 0.22
click:
  # Deterministic dry UI clicks, stored with this pack.
  files:
    - click_01.wav
    - click_02.wav
    - click_03.wav
    - click_04.wav
  volume: 0.32
  max_sec: 0.22
mg:
  enabled: true
  chapter: shutter
  diagram: shutter
  emphasis: click
  chip: click
density:
  sec_per_sfx: 30
  min_gap_sec: 1.2
  shutter_click_min_gap_sec: 0.4
  typing_merge_gap_sec: 1.5
